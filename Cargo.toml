[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "shopping-sessions"
path = "src/main.rs"

[dependencies]
bytes = "=1.12.2"
hashbrown = "=0.17.1"
memchr = "=2.8.3"
memmap2 = "=0.9.8"
libc = "=0.2.191"
mimalloc = { version = "=0.1.52", default-features = false }
parquet = { version = "=60.1.0", default-features = false, features = ["snap"] }
rustc-hash = "=2.1.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
